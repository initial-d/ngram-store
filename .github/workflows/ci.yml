name: CI

on:
  push:
  pull_request:

jobs:
  python-tools:
    name: Python tool tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run unit tests
        run: python -m unittest discover -s tests
      - name: Check full legacy exporter translation unit
        run: c++ -std=c++11 -I. -Imylib/include -fsyntax-only src/fasttext.cc
      - name: Verify complete serving evidence provenance
        run: python docs/certified_serving_evidence_20261103/verify.py
      - name: Verify partial-query bounds and coverage evidence
        run: python docs/budgeted_bag_evidence_20261104/verify.py
      - name: Verify native bounded-plan timings and frozen contracts
        run: python docs/native_bounded_query_evidence_20261105/verify.py
      - name: Verify complete public news application and validation-only choices
        run: python -S docs/news_classifier_evidence_20261105/verify.py
      - name: Verify independent news, hybrid fairness and paired bootstrap evidence
        run: python -S docs/news_shift_evidence_20261105/verify.py
      - name: Verify held-out Qwen memory identity qualification
        run: python -S docs/qwen_quality_evidence_20261106/verify.py
      - name: Verify actual GPU training, codec pairing and isolated Qwen serving
        run: python -S docs/qwen_gpu_grid_evidence_20261106/verify.py
      - name: Verify jointly trained Qwen against independent cheaper controls
        run: python -S docs/qwen_joint_evidence_20261106/verify.py
      - name: Verify real Qwen3.5 interfaces and official MultiCounterFact score formulas
        run: python -S docs/counterfact_capacity_evidence_20261106/verify.py
      - name: Verify completed MultiCounterFact small-grid evidence
        run: python -S docs/counterfact_small_evidence_20261107/verify.py
      - name: Verify complete independent n-gram key evidence
        run: python -S docs/ngram_identity_evidence_20261107/verify.py

  torch-adapter:
    name: PyTorch gather adapter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU PyTorch
        run: |
          python -m pip install numpy 'faiss-cpu>=1.8,<2'
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Verify adapter and row storage
        run: python -m unittest discover -s tests

  qwen35-replay:
    name: Qwen3 and Qwen3.5 replay gradients
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned CPU research dependencies
        run: |
          python -m pip install numpy transformers==5.3.0
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Check both decoder architectures, target masking and gradients
        run: python -m unittest tests.test_counterfact_data tests.test_counterfact_retrieval tests.test_late_memory_replay tests.test_ngram_identity -v
      - name: Reproduce all independent-key paired bootstrap intervals on CPU
        run: python docs/ngram_identity_evidence_20261107/verify.py --bootstrap

  native-sanitizers:
    name: Native C sanitizers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check native ABI and malformed files
        run: python tools/check_native_sanitizers.py
      - name: Check original DATrie bridge and final representative guards
        run: |
          mkdir -p build
          c++ -std=c++11 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -Isrc -Inative -Imylib/include tests/structural_native_test.cc native/meft_structural.cc -Lmylib/lib -ltrie -lpub -o build/structural-sanitizers
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 build/structural-sanitizers

  fasttext-native-fusion:
    name: FastText native facade sanitizers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check original model IDs, row bytes and inference outputs
        env:
          MEFT_FUSION_SANITIZERS: "1"
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: python -m unittest tests.test_fasttext_native_bundle -v

  legacy-roundtrip:
    name: Legacy artifact roundtrip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Export and mmap real .z fixtures with sanitizers
        run: python tools/check_legacy_roundtrip.py --output-dir artifacts/legacy-roundtrip
      - name: Preserve build and roundtrip evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-roundtrip-report
          path: |
            artifacts/legacy-roundtrip/report.json
            artifacts/legacy-roundtrip/build.txt
            artifacts/legacy-roundtrip/run.txt

  engram-factory:
    name: Engram factory integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU demo dependencies
        run: |
          python -m pip install numpy sympy transformers tokenizers
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Build native row gather
        run: make native
      - name: Fetch source-pinned demo proposal
        run: |
          curl -fL https://raw.githubusercontent.com/initial-d/Engram/8b4155c2f8fc886ef27973d1164b798126f90c0d/engram_demo_v1.py -o /tmp/engram_factory_v1.py
      - name: Verify factory through full CPU module output
        run: |
          python tools/demo_engram_factory.py --proposal-source /tmp/engram_factory_v1.py --native-library build/libmeft_rows.so --output-dir artifacts/engram-factory
      - name: Preserve integration report
        uses: actions/upload-artifact@v4
        with:
          name: engram-factory-report
          path: artifacts/engram-factory/report.json

  tinyengram-checkpoint:
    name: TinyEngram checkpoint and cached Qwen decode
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned inference dependencies
        run: |
          python -m pip install numpy sympy loguru transformers==4.57.3 tokenizers==0.22.2 safetensors==0.7.0
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Fetch pinned TinyEngram source
        run: |
          mkdir -p /tmp/meft-tiny-source
          curl -fL https://raw.githubusercontent.com/AutoArk/TinyEngram/317f23832aa8f8e382a0916ec469e81ba12b6dff/engram.py -o /tmp/meft-tiny-source/engram.py
          curl -fL https://raw.githubusercontent.com/AutoArk/TinyEngram/317f23832aa8f8e382a0916ec469e81ba12b6dff/engram_qwen.py -o /tmp/meft-tiny-source/engram_qwen.py
      - name: Verify conversion and decode with real Qwen classes
        env:
          MEFT_TINYENGRAM_SOURCE: /tmp/meft-tiny-source
        run: python -m unittest tests.test_tinyengram_checkpoint -v

  memory-wheels:
    name: Native memory wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and install standalone native wheel
        run: |
          python -m pip wheel . --no-deps --wheel-dir /tmp/meft-wheels
          python -m pip install --no-deps /tmp/meft-wheels/*.whl
      - name: Verify installed package outside checkout without Torch
        run: |
          cd /tmp
          python "$GITHUB_WORKSPACE/tools/check_memory_wheel.py"
      - name: Verify installed NumPy-only incidence extra
        run: |
          python -m pip install 'meft-memory[incidence]' --find-links /tmp/meft-wheels
          cd /tmp
          python "$GITHUB_WORKSPACE/tools/check_incidence_wheel.py"
          python "$GITHUB_WORKSPACE/examples/reproduce_certified_demo.py" --output /tmp/ngram-store-reproduction
      - uses: actions/upload-artifact@v4
        with:
          name: meft-memory-${{ matrix.os }}
          path: /tmp/meft-wheels/*.whl
